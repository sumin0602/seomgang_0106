<script>
function selectTeam(teamName) {
  document.getElementById('team').value = teamName;
  document.getElementById('team').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function previewImage(event) {
  const preview = document.getElementById('preview');

  if (event.target.files && event.target.files[0]) {
    preview.src = URL.createObjectURL(event.target.files[0]);
    preview.classList.remove('hidden');
  }
}

function runAIAnalysis() {
  const problem = document.getElementById('problem').value;
  const cause = document.getElementById('cause').value;
  const solution = document.getElementById('solution').value;
  const campaign = document.getElementById('campaign').value;
  const result = document.getElementById('aiResult');

  let text = "[AI 분석 결과]\n\n";

  if (problem.includes('쓰레기')) {
    text += "• 분리수거 강화와 지역 캠페인이 필요합니다.\n";
  }

  if (problem.includes('대기') || problem.includes('미세먼지')) {
    text += "• 대중교통 이용 확대와 차량 감축이 중요합니다.\n";
  }

  if (problem.includes('하천') || problem.includes('수질')) {
    text += "• 하천 정화 활동과 생활하수 관리가 필요합니다.\n";
  }

  if (text === "[AI 분석 결과]\n\n") {
    text += "• 지속적인 조사와 지역 참여 활동이 필요합니다.\n";
  }

  text += "\n[환경오염 원인]\n" + (cause || "입력된 내용이 없습니다.");
  text += "\n\n[학생 해결방안]\n" + (solution || "입력된 내용이 없습니다.");
  text += "\n\n[캠페인 계획]\n" + (campaign || "입력된 내용이 없습니다.");

  result.textContent = text;
}

function checkAdminLogin() {
  const id = document.getElementById('adminId').value;
  const pw = document.getElementById('adminPw').value;

  if (id === 'lsg2054' && pw === '3221') {
    document.getElementById('adminLogin').classList.add('hidden');
    document.getElementById('adminPage').classList.remove('hidden');
  } else {
    alert('아이디 또는 비밀번호가 올바르지 않습니다.');
  }
}

function saveSurveyFile() {
  const q1 = document.getElementById('surveyQ1').value;
  const q2 = document.getElementById('surveyQ2').value;
  const q3 = document.getElementById('surveyQ3').value;

  const scale = "1 매우 아니다 / 2 아니다 / 3 보통이다 / 4 그렇다 / 5 매우 그렇다";

  const content = `주민 대상 환경오염 설문지 (리커트 척도)

${scale}

1. ${q1}
□1 □2 □3 □4 □5

2. ${q2}
□1 □2 □3 □4 □5

3. ${q3}
□1 □2 □3 □4 □5`;

  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = '환경오염_주민설문지.txt';
  link.click();
}

function saveToFile() {
  const team = document.getElementById('team').value;
  const date = document.getElementById('date').value;
  const place = document.getElementById('place').value;
  const problem = document.getElementById('problem').value;
  const cause = document.getElementById('cause').value;
  const solution = document.getElementById('solution').value;
  const campaign = document.getElementById('campaign').value;

  const content = `우리 지역 환경오염 조사 프로젝트

조 이름: ${team}
조사 날짜: ${date}
조사 장소: ${place}

환경오염 문제:
${problem}

원인:
${cause}

해결 방안:
${solution}

환경 보호 캠페인 계획:
${campaign}`;

  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `${team || '조별'}_환경오염조사보고서.txt`;
  link.click();
}
</script>
